<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowCard AI</title>

<style>
body{
background:#090912;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#17172a;
padding:25px;
border-radius:25px;
box-shadow:0 0 25px #8a2be2;
}

h1{
color:#b36cff;
}

input,button{
width:90%;
padding:12px;
margin:10px;
border-radius:12px;
border:0;
}

button{
background:#8a2be2;
color:white;
font-size:18px;
}

.option{
background:#24243b;
padding:15px;
margin:10px;
border-radius:15px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h1>🌑 ShadowCard AI</h1>

<p>🤖 Создай рекламный текст для товара</p>

<input id="product" placeholder="Например: футболка">

<button onclick="generateText()">
🤖 Создать текст ИИ
</button>

<div id="results"></div>

</div>


<script>

function generateText(){

let product=document.getElementById("product").value;

if(product==""){
product="товар";
}

let texts=[
"🔥 НОВИНКА\nКРУТЫЕ "+product.toUpperCase()+"\nСТИЛЬ НА КАЖДЫЙ ДЕНЬ",

"✨ НОВЫЙ СТИЛЬ\n"+product.toUpperCase()+" TOP",

"🔥 ТВОЙ ВЫБОР\nМОДНЫЙ "+product.toUpperCase()
];


let html="";

texts.forEach(function(t){

html+=`
<div class="option" onclick="selectText(this)">
${t.replaceAll("\n","<br>")}
</div>
`;

});


document.getElementById("results").innerHTML=html;

}


function selectText(el){

alert("Выбран текст:\n\n"+el.innerText);

}

</script>

</body>
</html>
