<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShadowCard AI Studio</title>

<style>

body{
background:#07070d;
color:white;
font-family:Arial;
margin:0;
}

.app{
max-width:600px;
margin:auto;
padding:20px;
}

.logo{
font-size:32px;
font-weight:bold;
color:#b36cff;
text-align:center;
}

.card{
background:#151522;
padding:20px;
border-radius:25px;
margin-top:20px;
box-shadow:0 0 25px #8a2be2;
}

input,select,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:15px;
border:0;
font-size:16px;
}

button{
background:#8a2be2;
color:white;
font-weight:bold;
}

img{
max-width:100%;
border-radius:20px;
margin-top:15px;
}

.result{
background:#202033;
padding:15px;
border-radius:20px;
margin-top:20px;
}

</style>

</head>


<body>


<div class="app">

<div class="logo">
🌑 ShadowCard AI
</div>

<p style="text-align:center">
AI Studio для карточек товаров
</p>


<div class="card">


<h2>📸 Товар</h2>

<input type="file" id="photo" accept="image/*">


<img id="preview" style="display:none">


<h2>🎯 Задача</h2>

<select id="task">

<option>🖼 Главное фото товара</option>

<option>🎨 Инфографика</option>

<option>✨ Рекламный дизайн</option>

<option>🧹 Улучшить фото</option>

</select>



<h2>🎨 Стиль</h2>

<select id="style">

<option>⚡ Premium</option>

<option>🔥 Marketplace</option>

<option>🌑 Shadow</option>

<option>⚪ Minimal</option>

</select>



<button onclick="create()">

🤖 Создать AI дизайн

</button>


<div class="result" id="result">

Здесь появится результат

</div>


</div>


</div>


<script>


let image="";


document.getElementById("photo").onchange=function(){

let reader=new FileReader();

reader.onload=function(e){

image=e.target.result;

let img=document.getElementById("preview");

img.src=image;

img.style.display="block";

}

reader.readAsDataURL(this.files[0]);

}



function create(){

let task=document.getElementById("task").value;

let style=document.getElementById("style").value;


document.getElementById("result").innerHTML=

`

<h2>✨ Дизайн создан</h2>

${image ? `<img src="${image}">` : ""}

<p>🎯 ${task}</p>

<p>🎨 Стиль: ${style}</p>

<p>🌑 ShadowCard AI</p>

`;

}


</script>


</body>
</html>
