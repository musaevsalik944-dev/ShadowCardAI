<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowCard AI</title>

<style>
body {
  background: #0b0b12;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

.card {
  background: #171722;
  border-radius: 20px;
  padding: 25px;
  max-width: 450px;
  margin: auto;
  box-shadow: 0 0 20px #8a2be2;
}

h1 {
  color: #b36cff;
}

input, textarea {
  width: 90%;
  margin: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

button {
  background: #8a2be2;
  color: white;
  border: none;
  padding: 15px 25px;
  border-radius: 15px;
  font-size: 18px;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #222233;
  border-radius: 15px;
}
</style>

</head>

<body>

<div class="card">

<h1>🌑 ShadowCard AI</h1>

<p>Создание карточек товаров с помощью ИИ</p>

<input type="file">

<textarea placeholder="Введите описание товара"></textarea>

<br>

<button>
🚀 Создать карточку
</button>

<div class="result">
✨ Здесь появится готовая карточка товара
</div>

</div>

</body>
</html>
