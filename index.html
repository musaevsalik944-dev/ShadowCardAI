<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowCard AI Studio</title>

<style>
body{
background:#07070d;
color:white;
font-family:Arial;
margin:0;
}

.app{
max-width:600px;
margin:auto;
padding:20px;
}

.logo{
font-size:34px;
font-weight:bold;
color:#a855f7;
text-align:center;
}

.card{
background:#171725;
border-radius:25px;
padding:25px;
margin-top:20px;
box-shadow:0 0 30px #6d28d9;
}

input,textarea,select,button{
width:100%;
padding:15px;
margin-top:12px;
border-radius:15px;
border:0;
font-size:16px;
}

button{
background:#8b5cf6;
color:white;
font-weight:bold;
}

.preview img{
width:100%;
border-radius:20px;
margin-top:15px;
}

.result{
margin-top:20px;
padding:20px;
background:#222238;
border-radius:20px;
}
</style>

</head>

<body>

<div class="app">

<div class="logo">
🌑 ShadowCard AI
</div>

<p style="text-align:center">
AI Studio для создания карточек товаров
</p>


<div class="card">

<h2>📸 Фото товара</h2>

<input type="file" id="photo" accept="image/*">


<div class="preview">
<img id="preview" style="display:none">
</div>


<h2>✍️ Задание для ИИ</h2>

<textarea id="prompt"
placeholder="Например: Сделай премиальную карточку футболки для маркетплейса">
</textarea>


<h2>🎨 Стиль</h2>

<select id="style">

<option>✨ Premium</option>
<option>🔥 Marketplace</option>
<option>💎 Luxury</option>
<option>🌑 Shadow</option>

</select>


<button onclick="createAI()">
🤖 Создать AI-дизайн
</button>


<div class="result" id="result">
Здесь появится результат
</div>


</div>

</div>


<script>

let image="";


document.getElementById("photo").onchange=function(){

let reader=new FileReader();

reader.onload=function(e){

image=e.target.result;

let img=document.getElementById("preview");

img.src=image;
img.style.display="block";

}

reader.readAsDataURL(this.files[0]);

}



function createAI(){

let prompt=document.getElementById("prompt").value;
let style=document.getElementById("style").value;


document.getElementById("result").innerHTML=`

<h2>🤖 Запрос отправлен</h2>

<p>${prompt}</p>

<p>Стиль: ${style}</p>

<p>⏳ Подключаем AI-генерацию...</p>

`;

}

</script>


</body>
</html>
