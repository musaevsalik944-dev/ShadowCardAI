<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowCard AI</title>

<style>
body{
background:#090912;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#17172a;
padding:25px;
border-radius:25px;
box-shadow:0 0 25px #8a2be2;
}

h1{
color:#b36cff;
}

input,textarea{
width:90%;
padding:12px;
margin:10px;
border-radius:12px;
border:0;
}

button{
background:#8a2be2;
color:white;
border:0;
padding:15px 25px;
border-radius:15px;
font-size:18px;
}

#preview{
max-width:90%;
border-radius:15px;
margin:15px;
}

.result{
margin-top:20px;
background:#24243b;
padding:15px;
border-radius:15px;
}
</style>

</head>

<body>

<div class="box">

<h1>🌑 ShadowCard AI</h1>

<p>Создание карточек товаров с ИИ</p>

<input id="photo" type="file" accept="image/*">

<br>

<img id="preview" style="display:none">

<textarea id="description" placeholder="Описание товара"></textarea>

<br>

<button onclick="makeCard()">
🚀 Создать карточку
</button>

<div class="result" id="result">
✨ Карточка появится здесь
</div>

</div>


<script>

let photo=document.getElementById("photo");
let preview=document.getElementById("preview");

photo.onchange=function(){
let file=this.files[0];

if(file){
preview.src=URL.createObjectURL(file);
preview.style.display="block";
}
}


function makeCard(){

let text=document.getElementById("description").value;

if(text==""){
text="Новый товар";
}

document.getElementById("result").innerHTML=
`
<h2>✨ Готово!</h2>

🛒 ${text}

<br><br>

⭐ Рейтинг: 5.0

<br>

📦 Категория: Товар

<br>

🚚 Быстрая доставка
`;

}

</script>

</body>
</html>
