<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowCard AI</title>

<style>
body{
background:#090912;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#17172a;
padding:25px;
border-radius:25px;
box-shadow:0 0 25px #8a2be2;
}

h1{
color:#b36cff;
}

input, select, button{
width:90%;
padding:12px;
margin:10px;
border-radius:12px;
border:0;
}

button{
background:#8a2be2;
color:white;
font-size:18px;
}

canvas{
max-width:100%;
margin-top:20px;
border-radius:15px;
}
</style>

</head>

<body>

<div class="box">

<h1>🌑 ShadowCard AI</h1>

<p>Создай AI-карточку товара</p>

<input id="photo" type="file" accept="image/*">

<input id="name" placeholder="Название товара">

<select id="style">
<option>⚪ Минимализм</option>
<option>🟣 Премиум</option>
<option>🔥 Маркетплейс</option>
<option>🌑 Shadow Style</option>
</select>

<button onclick="createCard()">
🤖 Создать AI-карточку
</button>

<canvas id="canvas"></canvas>

</div>


<script>

let img=new Image();
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let loaded=false;


document.getElementById("photo").onchange=function(){

let reader=new FileReader();

reader.onload=function(e){

img.onload=function(){

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

loaded=true;

}

img.src=e.target.result;

}

reader.readAsDataURL(this.files[0]);

}



function createCard(){

if(!loaded){
alert("Сначала загрузите фото");
return;
}

let name=document.getElementById("name").value;
let style=document.getElementById("style").value;


ctx.drawImage(img,0,0);


ctx.fillStyle="rgba(0,0,0,0.55)";
ctx.fillRect(0,canvas.height-160,canvas.width,160);


ctx.fillStyle="white";
ctx.font="bold 40px Arial";


ctx.fillText("🔥 "+name,30,canvas.height-100);


ctx.font="28px Arial";
ctx.fillText(style,30,canvas.height-55);


ctx.fillText("✨ AI DESIGN",30,canvas.height-20);


}

</script>

</body>
</html>
