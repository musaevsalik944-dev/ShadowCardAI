<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowCard AI</title>

<style>
body{
background:#090912;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#17172a;
padding:25px;
border-radius:25px;
box-shadow:0 0 25px #8a2be2;
}

h1{
color:#b36cff;
}

input,textarea{
width:90%;
padding:12px;
margin:10px;
border-radius:12px;
border:0;
}

button{
background:#8a2be2;
color:white;
padding:15px 25px;
border:0;
border-radius:15px;
font-size:18px;
}

img{
max-width:90%;
border-radius:15px;
margin-top:15px;
}

.result{
margin-top:20px;
background:#24243b;
padding:15px;
border-radius:15px;
}
</style>

</head>

<body>

<div class="box">

<h1>🌑 ShadowCard AI</h1>

<p>Создай карточку товара</p>

<input id="photo" type="file" accept="image/*">

<br>

<textarea id="description" placeholder="Описание товара"></textarea>

<br>

<button onclick="makeCard()">
🚀 Создать карточку
</button>

<div class="result" id="result">
✨ Здесь появится карточка
</div>

</div>


<script>

let selectedImage = "";

document.getElementById("photo").onchange = function(){

let file = this.files[0];

if(file){

selectedImage = URL.createObjectURL(file);

}

};


function makeCard(){

let text = document.getElementById("description").value;

if(text==""){
text="Новый товар";
}


document.getElementById("result").innerHTML =

`
<h2>✨ Карточка готова</h2>

${selectedImage ? `<img src="${selectedImage}">` : ""}

<br>

<h3>🛒 ${text}</h3>

⭐ Рейтинг: 5.0

<br>

📦 Категория: Товар

<br>

🚚 Быстрая доставка

`;

}

</script>

</body>
</html>
