<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowCard AI</title>

<style>
body{
background:#090912;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#17172a;
padding:20px;
border-radius:25px;
box-shadow:0 0 25px #8a2be2;
}

h1{
color:#b36cff;
}

input,textarea{
width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:0;
}

button{
background:#8a2be2;
color:white;
padding:15px 25px;
border:0;
border-radius:15px;
font-size:18px;
}

canvas{
max-width:100%;
margin-top:20px;
border-radius:15px;
}
</style>

</head>

<body>

<div class="box">

<h1>🌑 ShadowCard AI</h1>

<p>Создай карточку товара</p>

<input id="photo" type="file" accept="image/*">

<input id="name" placeholder="Название товара">

<input id="price" placeholder="Цена">

<button onclick="createCard()">
🚀 Создать карточку
</button>

<br>

<canvas id="canvas"></canvas>

</div>


<script>

let img = new Image();
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");


document.getElementById("photo").onchange=function(){

let file=this.files[0];

let reader=new FileReader();

reader.onload=function(e){

img.onload=function(){

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

}

img.src=e.target.result;

}

reader.readAsDataURL(file);

}



function createCard(){

ctx.drawImage(img,0,0);


ctx.fillStyle="rgba(0,0,0,0.6)";
ctx.fillRect(0,canvas.height-170,canvas.width,170);


ctx.fillStyle="white";
ctx.font="bold 40px Arial";


let name=document.getElementById("name").value;
let price=document.getElementById("price").value;


ctx.fillText(name,30,canvas.height-110);

ctx.fillText("💰 "+price+" ₽",30,canvas.height-60);

ctx.fillText("⭐ 4.9  🚚 Доставка",30,canvas.height-20);


}

</script>

</body>
</html>
