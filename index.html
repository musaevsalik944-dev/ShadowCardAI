<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowCard AI</title>

<style>
body{
margin:0;
background:#050509;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

.container{
padding:25px;
max-width:500px;
margin:auto;
}

.logo{
font-size:32px;
font-weight:bold;
color:#b36cff;
}

.box{
background:#151522;
border-radius:25px;
padding:25px;
margin-top:20px;
box-shadow:0 0 30px #8a2be2;
}

input,select,button,textarea{
width:90%;
padding:14px;
margin:10px;
border-radius:15px;
border:none;
font-size:16px;
}

button{
background:#8a2be2;
color:white;
font-weight:bold;
}

.preview{
margin-top:20px;
}

img{
max-width:100%;
border-radius:20px;
}

.result{
background:#202033;
padding:20px;
border-radius:20px;
margin-top:20px;
}

.style{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.style button{
width:40%;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🌑 ShadowCard AI</div>

<p>AI-дизайнер карточек товаров</p>


<div class="box">

<h2>📸 Загрузите товар</h2>

<input type="file" id="photo" accept="image/*">

<div class="preview">
<img id="preview" style="display:none">
</div>


<textarea id="name" placeholder="Название товара"></textarea>


<h3>🎨 Выберите стиль</h3>

<div class="style">

<button onclick="setStyle('Premium')">
✨ Premium
</button>

<button onclick="setStyle('Marketplace')">
🔥 Marketplace
</button>

<button onclick="setStyle('Minimal')">
⚪ Minimal
</button>

<button onclick="setStyle('Shadow')">
🌑 Shadow
</button>

</div>


<button onclick="createDesign()">
🤖 Создать AI-дизайн
</button>


<div class="result" id="result">
Здесь появится дизайн
</div>


</div>

</div>


<script>

let image="";
let style="Premium";


document.getElementById("photo").onchange=function(){

let reader=new FileReader();

reader.onload=function(e){

image=e.target.result;

let img=document.getElementById("preview");

img.src=image;
img.style.display="block";

}

reader.readAsDataURL(this.files[0]);

}



function setStyle(s){

style=s;

}


function createDesign(){

let name=document.getElementById("name").value;

if(name==""){
name="Ваш товар";
}


document.getElementById("result").innerHTML=`

<h2>✨ AI дизайн готов</h2>

<img src="${image}">

<h3>${name}</h3>

<p>Стиль: ${style}</p>

<p>🌑 Создано в ShadowCard AI</p>

`;

}

</script>


</body>
</html>
